# Capstone project -- single Kafka broker in KRaft mode (no ZooKeeper)
services:
  kafka:
    image: apache/kafka:3.8.0
    container_name: capstone-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # INTERNAL listener added so the other containers can reach the broker (kafka:29092)
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,INTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,INTERNAL://kafka:29092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092
      interval: 5s
      timeout: 10s
      retries: 20

  # creates the six topics then publishes the catalog, and exits
  init:
    build: .
    image: capstone-app
    environment:
      BOOTSTRAP_SERVERS: kafka:29092
    volumes:
      - .:/app
    command: sh -c "python scripts/create_topics.py && python producers/publish_catalog.py"
    depends_on:
      kafka:
        condition: service_healthy

  simulator:
    image: capstone-app
    environment:
      BOOTSTRAP_SERVERS: kafka:29092
    volumes:
      - .:/app
    command: python producers/produce_vehicle_events.py --rate 20
    depends_on:
      init:
        condition: service_completed_successfully

  notifier1:
    image: capstone-app
    container_name: notifier1
    environment:
      BOOTSTRAP_SERVERS: kafka:29092
      NOTIFIER_NAME: notifier1
    volumes:
      - .:/app
    command: python consumers/alerts_notifier.py
    depends_on:
      init:
        condition: service_completed_successfully

  notifier2:
    image: capstone-app
    container_name: notifier2
    environment:
      BOOTSTRAP_SERVERS: kafka:29092
      NOTIFIER_NAME: notifier2
    volumes:
      - .:/app
    command: python consumers/alerts_notifier.py
    depends_on:
      init:
        condition: service_completed_successfully

  spark-streaming:
    image: capstone-app
    container_name: spark-streaming
    ports:
      - "4040:4040"
    environment:
      BOOTSTRAP_SERVERS: kafka:29092
      DATA_DIR: /app/data
    volumes:
      - .:/app
      - ivy-cache:/root/.ivy2
    command: spark-submit --packages org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.1 --conf spark.sql.shuffle.partitions=6 spark_jobs/streaming_job.py
    depends_on:
      init:
        condition: service_completed_successfully

  airflow:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    image: capstone-airflow
    container_name: airflow
    user: root
    ports:
      - "8080:8080"
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      BOOTSTRAP_SERVERS: kafka:29092
      DATA_DIR: /app/data
    volumes:
      - ./airflow_dags:/opt/airflow/dags
      - .:/app
    command: standalone
    depends_on:
      init:
        condition: service_completed_successfully

volumes:
  kafka-data:
  ivy-cache:
